name: MacOS

on:
  schedule:
    - cron: '0 5 * * *'
  push:
    branches-ignore: develop
  pull_request:
    branches-ignore: develop

permissions: {}

jobs:
  CI_Tests:
    strategy:
      fail-fast: false
      matrix:
        cpp_version: [ 17, 20 ]
        build_type: [ Debug, Release ]
        os: [ macos-latest ]
        toolset: [ clang++ ]
    runs-on: ${{ matrix.os }}
    name: "${{ matrix.os }} ${{ matrix.toolset }} ${{ matrix.cpp_version }} ${{ matrix.build_type }}"
    steps:
      - uses: actions/checkout@v7
      - name: Create Build
        run: |
          mkdir build
          brew install ninja
      - name: CMake Config
        env:
          CXX: ${{ matrix.toolset }}
        run: cmake -GNinja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DDAW_ENABLE_TESTING=ON -DCMAKE_CXX_STANDARD=${{ matrix.cpp_version }} -Bbuild/ .
      - name: Build
        run: cmake --build build/ --target full -- -k 0
        continue-on-error: true
      - name: Test
        run: |
          ulimit -c unlimited
          ulimit -c
          ctest -C ${{ matrix.build_type }} -j2 -VV --timeout 1200 --test-dir build/
      - name: Archive any crashes as an artifact
        uses: actions/upload-artifact@v4
        if: always( )
        with:
          name: crashes-${{ matrix.os }}-${{ matrix.cpp_version }}-${{ matrix.build_type }}
          path: |
            crash-*
            leak-*
            timeout-*
            /cores/**
          if-no-files-found: ignore
